name: Verify Atlas Derslik

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '25 2 * * *'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm --filter @repo/shared build
      - run: pnpm --filter @repo/ui build
      - run: pnpm verify:auth-navigation
      - run: pnpm verify:api-session
      - run: pnpm --filter api exec jest --runInBand
      - run: pnpm verify:commerce
      - run: pnpm --filter api build
      - run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: https://atlasderslik-api.onrender.com
